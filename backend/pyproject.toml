[project]
name = "wolf-day-parser"
version = "0.1.0"
description = "Parser service for the Wolf Day vehicle workshop dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "live_llm: calls the configured external LLM service",
  "slow: long-running full-dataset benchmark",
]
